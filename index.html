<style>
  :root{
    --bg:#FBF4E6;            /* warm cream */
    --bg-soft:#F9E9F1;        /* soft blush */
    --ink:#1B1410;
    --ink-2:#5C4D45;
    --muted:#B8A89E;
    --line:#F0E3D5;
    --card:var(--pink-4);     /* soft palette-aware card bg */
    --pink:#9DD0B0;
    --pink-2:#C2E2CC;
    --pink-3:#DEF0E5;
    --pink-4:#EFF8F2;
    --pink-rgb: 157, 208, 176;
    --green:#7FB28A;
    --peach:#F4B89C;
    --lilac:#C9B6E8;
    --sky:#A6CFE6;
    --yolk:#F5D364;
    --radius:24px;

    /* Depth tokens */
    --sh-card:
      inset 0 1px 0 rgba(255,255,255,.55),
      0 1px 2px rgba(120,80,60,.05),
      0 10px 24px -12px rgba(120,80,60,.18);
    --sh-card-lg:
      inset 0 1px 0 rgba(255,255,255,.7),
      0 2px 4px rgba(120,80,60,.05),
      0 24px 48px -16px rgba(120,80,60,.20);
    --sh-pill:
      inset 0 1px 0 rgba(255,255,255,.55),
      0 6px 14px -4px rgba(var(--pink-rgb), .35),
      0 2px 4px rgba(0,0,0,.04);
    --sh-fab:
      inset 0 1px 0 rgba(255,255,255,.45),
      0 16px 32px -8px rgba(var(--pink-rgb), .55),
      0 0 0 6px rgba(var(--pink-rgb), .10),
      0 6px 14px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  /* Atmospheric body bg — soft radial wash behind the phone */
  html,body{
    margin:0;padding:0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 20%, #F8DDE7 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 80%, #E5D4ED 0%, transparent 60%),
      linear-gradient(180deg, #F2D9E5 0%, #E8D2DD 100%);
    background-attachment: fixed;
    font-family:'DM Sans',ui-sans-serif,system-ui,sans-serif;color:var(--ink);
  }
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}

  /* All tinted cards get layered depth: top highlight + subtle shadow + soft drop */
  [style*="background:var(--card)"],
  [style*="background: var(--card)"]{
    box-shadow: var(--sh-card);
    background-image: linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 60%);
  }
  /* Optional elevated variant for hero cards (TODAY) */
  .card-hero{
    box-shadow: var(--sh-card-lg) !important;
  }
  /* FAB / primary buttons w/ explicit class get the colored floating shadow */
  .fab{
    box-shadow: var(--sh-fab) !important;
  }
  .btn-primary{
    box-shadow: var(--sh-pill);
  }
  .btn-primary:active{
    box-shadow:
      inset 0 2px 4px rgba(0,0,0,.12),
      0 2px 6px -2px rgba(var(--pink-rgb), .35);
    transform: translateY(1px);
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;}
  input,textarea{font-family:inherit;color:inherit;}
  ::-webkit-scrollbar{width:0;height:0;}
  /* hide scrollbars inside the phone */
  .scroll{overflow-y:auto;scrollbar-width:none;}
  .scroll::-webkit-scrollbar{display:none;}
</style>

// individual prototypes don't re-roll it. Ships a consistent set of controls so you
// don't hand-draw <input type="range">, segmented radios, steppers, etc.
//
// Usage (in an HTML file that loads React + Babel):

//           <TweakSlider label="Font size" value={t.fontSize} min={10} max={32} unit="px"
//                        onChange={(v) => setTweak('fontSize', v)} />

//                        options={['compact', 'regular', 'comfy']}
//                        onChange={(v) => setTweak('density', v)} />
//           <TweakSection label="Theme" />
//           <TweakColor  label="Primary" value={t.primaryColor}
//                        options={['#D97757', '#2A6FDB', '#1F8A5B', '#7A5AE0']}
//                        onChange={(v) => setTweak('primaryColor', v)} />
//           <TweakColor  label="Palette" value={t.palette}
//                        options={[['#D97757', '#29261b', '#f6f4ef'],
//                                  ['#475569', '#0f172a', '#f1f5f9']]}
//                        onChange={(v) => setTweak('palette', v)} />
//           <TweakToggle label="Dark mode" value={t.dark}
//                        onChange={(v) => setTweak('dark', v)} />

//       </div>

//
// TweakRadio is the segmented control for 2–3 short options (auto-falls-back to
// TweakSelect past ~16/~10 chars per label); reach for TweakSelect directly when
// options are many or long. For color tweaks always curate 3-4 options rather than
// a free picker; an option can also be a whole 2–5 color palette (the stored value
// is the array). The Tweak* controls are a floor, not a ceiling — build custom
// controls inside the panel if a tweak calls for UI they don't cover.
/* END USAGE */
// ─────────────────────────────────────────────────────────────────────────────

const __TWEAKS_STYLE = `

  .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}

    color:rgba(41,38,27,.45);padding:10px 0 0}
  .twk-sect:first-child{padding-top:0}

    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='rgba(0,0,0,.5)' d='M0 0h10L5 6z'/></svg>");
    background-repeat:no-repeat;background-position:right 8px center}

    width:14px;height:14px;border-radius:50%;background:#fff;

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

// ── Shared PUBLIC challenge registry ─────────────────────────────────────────
// Public challenges live in one shared store (key 'bloom:public') that EVERY
// account reads from — so a challenge made public by any user shows up in the
// Discover section for everyone, independent of which account is logged in.
const PUBLIC_KEY = 'bloom:public';
function loadPublicChallenges(){
  try { return JSON.parse(localStorage.getItem(PUBLIC_KEY)) || []; }
  catch { return []; }
}
function savePublicChallenges(list){
  try { localStorage.setItem(PUBLIC_KEY, JSON.stringify(list)); } catch {}
}
function addPublicChallenge(ch){
  const list = loadPublicChallenges();
  if(!list.some(x => x.id === ch.id)){
    list.unshift(ch);
    savePublicChallenges(list);
  }
}
function publicChallengeById(id){
  return loadPublicChallenges().find(c => c.id === id) || null;
}
// Bump a member count on a public challenge (when someone new joins it).
function bumpPublicMembers(id){
  const list = loadPublicChallenges();
  const c = list.find(x => x.id === id);
  if(c){ c.members = (c.members || 1) + 1; savePublicChallenges(list); }
}

// ── Shared FRIENDS-ONLY challenge registry ───────────────────────────────────
// A "friends" challenge is visible to its creator plus anyone who opens its
// invite link. Stored in 'bloom:friends'; each entry carries a short invite
// `code`. When a friend opens the link (?join=<code>) the code is saved to their
// account, which is how their account gets to see the challenge.
const FRIENDS_KEY = 'bloom:friends';
function normPhone(p){ return String(p||'').replace(/\D/g,'').replace(/^1/,'').slice(-10); }
// Short, link-friendly invite code (e.g. "k7f2qa").
function genInviteCode(){
  return Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 4);
}
// Build the shareable invite URL for a code, based on wherever the app is served.
function inviteUrl(code){
  if(typeof location === 'undefined') return 'https://softsapling.app/?join=' + code;
  return location.origin + location.pathname + '?join=' + code;
}
function loadFriendsChallenges(){
  try { return JSON.parse(localStorage.getItem(FRIENDS_KEY)) || []; }
  catch { return []; }
}
function saveFriendsChallenges(list){
  try { localStorage.setItem(FRIENDS_KEY, JSON.stringify(list)); } catch {}
}
function addFriendsChallenge(ch){
  const list = loadFriendsChallenges();
  if(!list.some(x => x.id === ch.id)){ list.unshift(ch); saveFriendsChallenges(list); }
}
function friendsChallengeById(id){
  return loadFriendsChallenges().find(c => c.id === id) || null;
}
function friendsChallengeByCode(code){
  if(!code) return null;
  return loadFriendsChallenges().find(c => c.code === code) || null;
}
function bumpFriendsMembers(id){
  const list = loadFriendsChallenges();
  const c = list.find(x => x.id === id);
  if(c){ c.members = (c.members || 1) + 1; saveFriendsChallenges(list); }
}
// Friends-only challenges this person can see: ones they host, or ones whose
// invite code they've redeemed by opening the link.
function friendsChallengesFor(redeemedCodes, myEmail){
  const codes = redeemedCodes || [];
  return loadFriendsChallenges().filter(c =>
    (myEmail && c.hostEmail === myEmail) || codes.includes(c.code));
}

// ── Shared CHEERS registry ───────────────────────────────────────────────────
// Emoji cheers left on a challenge. Stored in 'bloom:cheers' keyed by challenge
// id, so any account viewing the same challenge sees the cheers others left —
// this is how friends cheer each other on across accounts.
// Shape: { [challengeId]: [ { emoji, fromKey, fromName, ts } ] }
const CHEERS_KEY = 'bloom:cheers';
const CHEER_EMOJIS = ['👏','🔥','💪','🌸','✨','🙌','💛'];
function loadAllCheers(){ try{ return JSON.parse(localStorage.getItem(CHEERS_KEY)) || {}; }catch{ return {}; } }
function saveAllCheers(m){ try{ localStorage.setItem(CHEERS_KEY, JSON.stringify(m)); }catch{} }
function cheersFor(challengeId){ return (loadAllCheers()[challengeId]) || []; }
function addCheer(challengeId, cheer){
  const all = loadAllCheers();
  const list = all[challengeId] || [];
  list.push(cheer);
  all[challengeId] = list;
  saveAllCheers(all);
  return list;
}
// Toggle off: remove this person's most recent cheer of that emoji.
function removeCheer(challengeId, fromKey, emoji){
  const all = loadAllCheers();
  const list = all[challengeId] || [];
  for(let i=list.length-1;i>=0;i--){
    if(list[i].fromKey===fromKey && list[i].emoji===emoji){ list.splice(i,1); break; }
  }
  all[challengeId] = list;
  saveAllCheers(all);
  return list;
}

function catById(id){ return CATEGORIES.find(c=>c.id===id) || CATEGORIES[0]; }
function personById(id){ return PEOPLE.find(p=>p.id===id) || PEOPLE[0]; }

// ── Shared USERNAME directory ────────────────────────────────────────────────
// Every account claims a unique @username at signup. Stored in one shared
// registry (like the public/friends challenge lists) so it can be checked for
// availability and searched by other users trying to find a friend.
const USERNAMES_KEY = 'bloom:usernames';
function normUsername(u){ return String(u||'').trim().toLowerCase().replace(/[^a-z0-9_.]/g,''); }
function loadUsernames(){
  try { return JSON.parse(localStorage.getItem(USERNAMES_KEY)) || {}; }
  catch { return {}; }
}
function saveUsernames(map){
  try { localStorage.setItem(USERNAMES_KEY, JSON.stringify(map)); } catch {}
}
function isUsernameAvailable(username, exceptEmail){
  const u = normUsername(username);
  if(u.length < 3) return false;
  const map = loadUsernames();
  const hit = map[u];
  return !hit || hit.email === exceptEmail;
}
// Claim a username for an account, releasing any previous one it held.
function registerUsername(username, email, name, photo){
  const u = normUsername(username);
  if(!u || !email) return;
  const map = loadUsernames();
  Object.keys(map).forEach(k => { if(map[k].email === email && k !== u) delete map[k]; });
  map[u] = { email, name: name||'', photo: photo||null };
  saveUsernames(map);
}
// All claimed usernames except the given account — the searchable directory.
function searchUsernames(query, exceptEmail){
  const q = normUsername(query);
  if(!q) return [];
  const map = loadUsernames();
  return Object.keys(map)
    .filter(u => u.includes(q) && map[u].email !== exceptEmail)
    .slice(0, 20)
    .map(u => ({ username:u, ...map[u] }));
}

  CHEER_EMOJIS, cheersFor, addCheer, removeCheer,

});

// Read an image File and return a downscaled JPEG data URL. Photos are stored in
// the account (localStorage), so we shrink them to keep accounts small and well
// under the storage quota — otherwise large camera photos would silently fail to
// save. maxDim caps the longest edge; quality is JPEG quality (0–1).
function fileToCompressedDataURL(file, maxDim = 720, quality = 0.72) {
  return new Promise((resolve, reject) => {
    if(!file) { reject(new Error('no file')); return; }
    const r = new FileReader();
    r.onerror = () => reject(r.error);
    r.onload = () => {
      const img = new Image();
      img.onerror = () => resolve(r.result); // fall back to original if decode fails
      img.onload = () => {
        try {
          let { width, height } = img;
          if(width > height && width > maxDim){ height = Math.round(height * maxDim / width); width = maxDim; }
          else if(height >= width && height > maxDim){ width = Math.round(width * maxDim / height); height = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        } catch(e) { resolve(r.result); }
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

          transition:'transform .28s cubic-bezier(.22,.9,.34,1)',

        {/* Header */}

          padding:'14px 22px 6px',
          display:'flex', alignItems:'center', gap:12,

          <CategoryBadge catId={challenge.cat} size={44}/>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{
              fontSize:11, fontWeight:800, color:cat.color, letterSpacing:1, textTransform:'uppercase',
            }}>day {challenge.dayIn + 1} of {challenge.days}</div>
            <div style={{ fontSize:18, fontWeight:800, letterSpacing:-.3, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
              {challenge.title}
            </div>
          </div>
          <button onClick={handleClose} style={{
            width:34, height:34, borderRadius:17, background:'var(--card)',
            display:'flex', alignItems:'center', justifyContent:'center',

            <Icon.X size={16}/>

        </div>

        {/* Body */}
        <div className="scroll" style={{ flex:1, overflowY:'auto', padding:'14px 22px 0' }}>
          {/* Prompt */}
          <div style={{
            background:'var(--card)', borderRadius:14, padding:'10px 14px',
            display:'flex', alignItems:'center', gap:10,

            <div style={{
              width:8, height:8, borderRadius:4, background:cat.color, flex:'none',

              {cat.prompt}

          </div>

            marginTop:14, width:'100%',
            background: photo ? `center/cover url(${photo})` : '#fff',
            border: photo ? 'none' : `2px dashed ${cat.color}88`,
            borderRadius:20, aspectRatio:'4/3', maxHeight:260,
            position:'relative', overflow:'hidden',
            display:'flex', alignItems:'center', justifyContent:'center',
          }}>
            {!photo && (
              <div style={{ textAlign:'center' }}>
                <div style={{
                  width:56, height:56, borderRadius:28, margin:'0 auto',
                  background:cat.color+'33', color:cat.color,
                  display:'flex', alignItems:'center', justifyContent:'center',
                }}>
                  <Icon.Plus size={24} stroke={2.5}/>
                </div>
                <div style={{ fontSize:14, fontWeight:700, marginTop:10 }}>add proof</div>

                  {photoRequired ? 'required for ' + cat.label : 'optional'}

            {photo && (
              <div style={{
                position:'absolute', right:10, bottom:10,
                display:'flex', gap:8,
              }}>
                <button onClick={(e)=>{e.stopPropagation(); setPhoto(null);}} style={{
                  background:'rgba(27,20,16,.7)', color:'#fff',
                  padding:'8px 12px', borderRadius:999, fontSize:12, fontWeight:700,
                  display:'flex', alignItems:'center', gap:6,
                }}>
                  <Icon.X size={14} stroke={2.5}/> remove
                </button>
              </div>
            )}
          </button>
          <input
            ref={fileRef} type="file" accept="image/*"
            style={{ display:'none' }}
            onChange={e => onPick(e.target.files?.[0])}
          />

          {/* Note */}
          <div style={{ marginTop:14, background:'var(--card)', borderRadius:18, padding:'12px 14px' }}>
            <textarea
              value={note}
              onChange={e=>setNote(e.target.value)}

            <div style={{
              textAlign:'center', marginTop:8,
              fontSize:11.5, color:'var(--ink-2)',

        </div>
      </div>
    </div>
  );
};

// =========================================================
// SEARCH OVERLAY — search all challenges by title / category
// =========================================================
const SearchOverlay = ({ onClose, onOpenChallenge, joined, onJoin }) => {
  const [q, setQ] = useState('');
  const inputRef = useRef(null);
  useEffect(() => { inputRef.current?.focus(); }, []);

  // Unified pool: your own challenges + all shared public challenges
  const pool = useMemo(() => {
    const seenIds = new Set();
    const seed = SEED_CHALLENGES.map(c => {
      seenIds.add(c.id);
      return {
        id:c.id, title:c.title, cat:c.cat, sub: catById(c.cat).label + ' · ' + c.days + ' days',
        members: c.members.length, kind:'seed',
      };
    });
    const pub = loadPublicChallenges()
      .filter(p => !seenIds.has(p.id))
      .map(p => ({
        id:p.id, title:p.title, cat:p.cat,
        sub: 'by ' + (p.hostName || 'someone') + ' · ' + (p.members || 1) + ' in',
        kind:'public',
      }));
    return [...seed, ...pub];
  }, []);

  const query = q.trim().toLowerCase();
  const results = query
    ? pool.filter(c =>
        c.title.toLowerCase().includes(query) ||
        catById(c.cat).label.toLowerCase().includes(query) ||
        catById(c.cat).hint.toLowerCase().includes(query))
    : [];

  return (
    <div style={{
      position:'absolute', inset:0, top:50, bottom:0, zIndex:28,
      background:'var(--bg)', display:'flex', flexDirection:'column',
    }}>
      {/* search bar */}
      <div style={{ padding:'14px 18px 8px', display:'flex', alignItems:'center', gap:10 }}>
        <div style={{
          flex:1, background:'var(--card)', borderRadius:16, padding:'12px 14px',
          display:'flex', alignItems:'center', gap:10,
          boxShadow:'inset 0 1px 0 rgba(255,255,255,.5)',
        }}>
          <Icon.Search size={18} color="var(--muted)"/>
          <input
            ref={inputRef} value={q} onChange={e=>setQ(e.target.value)}
            placeholder="search challenges…"
            style={{ flex:1, border:'none', outline:'none', background:'transparent', fontSize:15, fontWeight:600 }}
          />
          {q && (
            <button onClick={()=>setQ('')} style={{
              width:22, height:22, borderRadius:11, background:'var(--pink-3)',
              display:'flex', alignItems:'center', justifyContent:'center',
            }}><Icon.X size={13} color="var(--ink-2)"/></button>
          )}
        </div>
        <button onClick={onClose} style={{ fontSize:14, fontWeight:700, color:'var(--pink)', padding:'0 4px' }}>cancel</button>
      </div>

      <div className="scroll" style={{ flex:1, overflowY:'auto', padding:'8px 22px 40px' }}>
        {!query ? (
          <>
            <div style={{ fontSize:13, fontWeight:700, color:'var(--ink-2)', margin:'10px 0 10px' }}>browse by category</div>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
              {CATEGORIES.map(c=>{
                const G = Icon[c.icon];
                return (
                  <button key={c.id} onClick={()=>setQ(c.label)} style={{
                    background:'var(--card)', borderRadius:16, padding:'14px',
                    display:'flex', alignItems:'center', gap:11, textAlign:'left',
                    boxShadow:'inset 0 1px 0 rgba(255,255,255,.5), 0 6px 16px -10px rgba(120,80,60,.22)',
                  }}>
                    <div style={{
                      width:36, height:36, borderRadius:12, background:c.color+'33', color:c.color,
                      display:'flex', alignItems:'center', justifyContent:'center',
                    }}><G size={18} color={c.color} stroke={2.2}/></div>
                    <div style={{ fontWeight:700, fontSize:13.5 }}>{c.label}</div>
                  </button>
                );
              })}
            </div>
          </>
        ) : results.length===0 ? (
          <div style={{ textAlign:'center', padding:'50px 20px' }}>
            <Icon.Sapling size={30} stroke={1.6} color="var(--ink-2)"/>
            <div style={{ fontWeight:700, fontSize:16, marginTop:8 }}>no matches for “{q}”</div>
            <div style={{ fontSize:13, color:'var(--ink-2)', marginTop:4 }}>try a category, or start your own challenge.</div>
          </div>
        ) : (
          <div style={{ display:'grid', gap:10, paddingTop:8 }}>
            <div style={{ fontSize:12.5, color:'var(--ink-2)', fontWeight:600 }}>{results.length} result{results.length>1?'s':''}</div>
            {results.map(c=>{
              const cat = catById(c.cat);
              const G = Icon[cat.icon];
              const isJoined = joined.includes(c.id);
              return (
                <div key={c.id+c.kind} onClick={()=>{ onOpenChallenge(c.id, c.kind==='featured'?'featured':undefined); onClose(); }}
                  role="button" style={{
                    background:'var(--card)', borderRadius:18, padding:'12px 14px',
                    display:'flex', alignItems:'center', gap:12,
                    boxShadow:'inset 0 1px 0 rgba(255,255,255,.5), 0 6px 16px -10px rgba(120,80,60,.2)',
                  }}>
                  <div style={{
                    width:46, height:46, borderRadius:14, flex:'none',
                    background:`linear-gradient(135deg, ${cat.color}99, ${cat.color}55)`,
                    display:'flex', alignItems:'center', justifyContent:'center',
                  }}><G size={22} color="#fff" stroke={2.2}/></div>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontWeight:700, fontSize:14.5, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{c.title}</div>
                    <div style={{ fontSize:12, color:'var(--ink-2)', marginTop:1 }}>{c.sub}</div>
                  </div>
                  {c.kind==='featured' && (
                    <button onClick={(e)=>{ e.stopPropagation(); onJoin(c.id); }} style={{
                      background: isJoined ? 'var(--pink-4)' : 'var(--pink)',
                      color: isJoined ? 'var(--pink)' : '#fff',
                      padding:'7px 13px', borderRadius:999, fontSize:12, fontWeight:700, flex:'none',
                    }}>{isJoined ? 'joined' : 'join'}</button>
                  )}
                  {c.kind==='seed' && <Icon.Forward size={18} color="var(--muted)"/>}
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
};

// =========================================================
// DISCOVER SCREEN — utility-first: today's check-ins as hero
// =========================================================
const Discover = ({ onOpenChallenge, onCreate, joined, onJoin, checkIns, onRequestCheckIn, todayStyle='list', discoverFrame=true, linkInvites=[] }) => {
  const [filter, setFilter] = useState('all');

  const myActive = SEED_CHALLENGES.filter(c => c.members.includes('me') && !c.startsLater);
  const doneToday = myActive.filter(c => checkIns[c.id]).length;

  // Public challenges that exist in the world — anyone's public challenge shows
  // here, including ones you create. Computed each render so newly created
  // Public challenges from the shared registry — created by ANY account, visible
  // to everyone. Marked "mine" if you created or already joined this one.
  const myName = (useProfile().profile?.name || 'you').split(' ')[0];
  const myProfile = useProfile().profile;
  const community = (() => {
    const mineIds = new Set(SEED_CHALLENGES.filter(c => c.members.includes('me')).map(c => c.id));
    const pub = loadPublicChallenges().map(c => ({
      id:c.id, cat:c.cat, title:c.title,
      host: c.hostName || 'someone',
      members: c.members || 1, days:c.days, kind:'public',
      mine: mineIds.has(c.id),
    }));
    return filter === 'all' ? pub : pub.filter(c => c.cat === filter);
  })();

  // Friends-only challenges shared with you (invited by phone) or that you host.
  const friendChallenges = (() => {
    const mineIds = new Set(SEED_CHALLENGES.filter(c => c.members.includes('me')).map(c => c.id));
    const list = friendsChallengesFor(linkInvites, myProfile?.email).map(c => ({
      id:c.id, cat:c.cat, title:c.title,
      host: c.hostEmail === myProfile?.email ? myName : (c.hostName || 'a friend'),
      members: c.members || 1, days:c.days, kind:'friends',
      mine: mineIds.has(c.id),
    }));
    return filter === 'all' ? list : list.filter(c => c.cat === filter);
  })();

  const [searchOpen, setSearchOpen] = useState(false);

  return (
    <div style={{ paddingBottom:120 }}>
      {searchOpen && <SearchOverlay onClose={()=>setSearchOpen(false)} onOpenChallenge={onOpenChallenge} joined={joined} onJoin={onJoin}/>}
      {/* Tight header */}
      <div style={{
        padding:'14px 22px 12px',
        display:'flex', alignItems:'center', justifyContent:'space-between', gap:12,
      }}>
        <div style={{ minWidth:0 }}>
          <div style={{ fontSize:11.5, color:'var(--ink-2)', fontWeight:700, letterSpacing:1.2 }}>TUE · MAY 27</div>
          <div style={{ fontSize:26, fontWeight:800, letterSpacing:-.4, marginTop:2 }}>good morning, {(useProfile().profile?.name || 'you').split(' ')[0].toLowerCase()}</div>
        </div>
        <button onClick={()=>setSearchOpen(true)} style={{
          width:40, height:40, borderRadius:20, background:'var(--card)',
          display:'flex', alignItems:'center', justifyContent:'center', flex:'none',
        }}>
          <Icon.Search size={18} color="var(--ink-2)"/>
        </button>
      </div>

      {/* TODAY hero — layout per tweak */}
      <div style={{ padding:'2px 22px 18px' }}>
        {myActive.length === 0
          ? <EmptyToday onCreate={onCreate}/>
          : todayStyle === 'stories'
            ? <TodayStories items={myActive} checkIns={checkIns}
                onOpen={onOpenChallenge} onRequestCheckIn={onRequestCheckIn}
                doneToday={doneToday}/>
            : todayStyle === 'focus'
              ? <TodayFocus items={myActive} checkIns={checkIns}
                  onOpen={onOpenChallenge} onRequestCheckIn={onRequestCheckIn}
                  doneToday={doneToday}/>
              : <TodayList items={myActive} checkIns={checkIns}
                  onOpen={onOpenChallenge} onRequestCheckIn={onRequestCheckIn}
                  doneToday={doneToday}/>
        }
      </div>

      {/* From your friends — friends-only challenges you were invited to */}
      {friendChallenges.length > 0 && (
        <>
          <div style={{ padding:'2px 22px 0' }}>
            <SectionHead title="from your friends" sub="shared just with your circle"/>
          </div>
          <div style={{ display:'grid', gap:10, padding:'12px 22px 18px' }}>
            {friendChallenges.map(item => (
              <FeaturedRow key={item.id} f={item}
                joined={joined.includes(item.id) || item.mine}
                onJoin={()=>onJoin(item.id)}
                onOpen={()=>onOpenChallenge(item.id, item.kind)}/>
            ))}
          </div>
        </>
      )}

      {/* Discover more — real challenges from other accounts */}
      <div style={{
        margin: discoverFrame ? '2px 14px 0' : '0',
        padding: discoverFrame ? '6px 8px 12px' : '0',
        borderRadius: discoverFrame ? 26 : 0,
        background: discoverFrame
          ? 'linear-gradient(180deg, var(--pink-4) 0%, rgba(var(--pink-rgb),.04) 100%)'
          : 'transparent',
        boxShadow: discoverFrame
          ? 'inset 0 1px 0 rgba(255,255,255,.6), 0 12px 28px -16px rgba(var(--pink-rgb),.4)'
          : 'none',
      }}>
        <div style={{ padding: discoverFrame ? '8px 14px 0' : '2px 22px 0' }}>
          <SectionHead
            title="discover more"
            sub="challenges from the community"
          />
        </div>

        {/* category filter pills */}
        <div className="scroll" style={{
          display:'flex', gap:8, padding: discoverFrame ? '12px 14px 4px' : '12px 22px 4px',
          overflowX:'auto',
        }}>
          <Pill active={filter==='all'} onClick={()=>setFilter('all')}>all</Pill>
          {CATEGORIES.map(c=>(
            <Pill key={c.id} active={filter===c.id} onClick={()=>setFilter(c.id)} color={c.color}>
              {c.label}
            </Pill>
          ))}
        </div>

        {/* real challenge cards */}
        <div style={{
          display:'grid', gap:10, padding: discoverFrame ? '10px 14px 4px' : '12px 22px 6px',
        }}>
          {community.length === 0 ? (
            <div style={{
              padding:'30px 18px', textAlign:'center',
              background:'var(--card)', borderRadius:18,
            }}>
              <Icon.Sapling size={26} stroke={1.6} color="var(--ink-2)"/>
              <div style={{ fontWeight:700, fontSize:14.5, marginTop:8 }}>
                {filter==='all' ? 'no public challenges yet' : `no ${catById(filter).label} challenges yet`}
              </div>
              <div style={{ fontSize:12.5, color:'var(--ink-2)', marginTop:3, maxWidth:240, marginLeft:'auto', marginRight:'auto', lineHeight:1.4 }}>
                public challenges show up here as people create them. be the first to start one.
              </div>
              <button onClick={onCreate} style={{
                marginTop:14, background:'var(--pink)', color:'#fff',
                padding:'10px 18px', borderRadius:999, fontWeight:700, fontSize:13,
              }}>create a challenge</button>
            </div>
          ) : community.map(item=>(
            <FeaturedRow key={item.kind+item.id} f={item}
              joined={joined.includes(item.id)}
              onJoin={()=>onJoin(item.id)}
              onOpen={()=>onOpenChallenge(item.id, item.kind)}/>
          ))}
        </div>
      </div>
    </div>
  );
};

// Stories layout — horizontal scrolling story circles (Instagram-vibe)

                width:'100%', height:'100%', borderRadius:'50%',
                background:'#fff', padding:3,

                  <div style={{
                    width:'100%', height:'100%', borderRadius:'50%',
                    backgroundImage:`url(${entry.photo})`, backgroundSize:'cover', backgroundPosition:'center',
                  }}/>

                  <div style={{
                    width:'100%', height:'100%', borderRadius:'50%',

                    display:'flex', alignItems:'center', justifyContent:'center',
                  }}>
                    <G size={28} color={cat.color} stroke={2}/>

                )}
              </div>
              <div style={{
                position:'absolute', right:-2, bottom:-2,
                width:24, height:24, borderRadius:12,
                background: done ? '#8BC79C' : 'var(--pink)', color:'#fff',

                display:'flex', alignItems:'center', justifyContent:'center',
              }}>
                {done ? <Icon.Check size={12} stroke={3}/> : <Icon.Water size={12} stroke={3}/>}
              </div>
            </div>
            <div style={{
              fontSize:11, fontWeight:700, marginTop:8, lineHeight:1.2,
              color: done ? 'var(--ink-2)' : 'var(--ink)',
              maxWidth:80, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis',
            }}>{c.title}</div>
            <div style={{
              fontSize:10, color:'var(--ink-2)', marginTop:1,
              display:'flex', alignItems:'center', justifyContent:'center', gap:3,
            }}>
              <Icon.Flame size={10} color="var(--pink)"/>
              <span style={{ color:'var(--pink)', fontWeight:700 }}>{c.streak + (done?1:0)}</span>
            </div>
          </button>
        );
      })}
    </div>
  </div>
);

// Focus layout — one big card at a time, with dots to switch
const TodayFocus = ({ items, checkIns, onOpen, onRequestCheckIn, doneToday }) => {
  const firstUndoneIdx = items.findIndex(c => !checkIns[c.id]);
  const [idx, setIdx] = useState(firstUndoneIdx === -1 ? 0 : firstUndoneIdx);
  const c = items[Math.min(idx, items.length-1)];
  const cat = catById(c.cat);
  const G = Icon[cat.icon];
  const entry = checkIns[c.id];

// Contacts come from the device address book via the Contacts Picker API.
// Nothing is hard-coded — this registry fills only with people the user picks.
const CONTACT_REGISTRY = [];
const CONTACT_COLORS = ['#ED91B5','#9DD0B0','#B89DDB','#7BB1D6','#F2B89D','#F0CF7E','#D89BAE','#A6CFE6','#C9B6E8','#7FB28A'];
let _ctSeq = 0;
const registerContact = ({ name, phone, username, photo }) => {
  // de-dupe by username, else phone, else name
  const key = (username || phone || name || '').replace(/\s/g,'');
  const existing = CONTACT_REGISTRY.find(c => (c.username||c.phone||c.name||'').replace(/\s/g,'') === key);
  if(existing) return existing;
  const c = {
    id: 'ct' + (++_ctSeq),
    name: name || 'Unknown',
    phone: phone || '',
    username: username || '',
    photo: photo || null,
    onBloom: !!username,
    color: CONTACT_COLORS[_ctSeq % CONTACT_COLORS.length],
  };
  CONTACT_REGISTRY.push(c);
  return c;
};
const contactById = (id) => CONTACT_REGISTRY.find(c=>c.id===id);
const contactsSupported = () => typeof navigator !== 'undefined' && 'contacts' in navigator && 'select' in navigator.contacts;

const GARDEN_BLOOMS = [];

// Pan + zoom a freshly-picked photo inside a circular frame, then bake the crop
// into a square JPEG so every avatar render (which all use center/cover) shows
// exactly what you framed. Drag to move, slider to zoom.
const PhotoAdjustSheet = ({ src, onSave, onClose }) => {
  const FRAME = 264;                 // on-screen editing square (circle is inscribed)
  const [animIn, setAnimIn] = useState(false);
  const [dims, setDims] = useState(null);   // { w, h, base } once the <img> loads
  const [scale, setScale] = useState(1);     // user zoom, 1..3
  const [offset, setOffset] = useState({ x:0, y:0 }); // image top-left vs frame top-left
  const imgRef = useRef(null);
  const drag = useRef(null);

  useEffect(()=>{ const t=setTimeout(()=>setAnimIn(true),10); return ()=>clearTimeout(t); },[]);
  const close = () => { setAnimIn(false); setTimeout(onClose, 220); };

  // Center the image at cover scale once we know its natural size. Driven by the
  // real <img>'s onLoad so there's no async-Image race / StrictMode flakiness.
  const onImgLoad = (e) => {
    const el = e.currentTarget;
    const w = el.naturalWidth, h = el.naturalHeight;
    if(!w || !h) return;
    const base = FRAME / Math.min(w, h);
    const dw = w * base, dh = h * base;
    setDims({ w, h, base });
    setScale(1);
    setOffset({ x:(FRAME-dw)/2, y:(FRAME-dh)/2 });
  };

  const clamp = (off, dScale) => {
    if(!dims) return off;
    const dw = dims.w * dScale, dh = dims.h * dScale;
    return {
      x: Math.min(0, Math.max(FRAME - dw, off.x)),
      y: Math.min(0, Math.max(FRAME - dh, off.y)),
    };
  };

  const displayScale = dims ? dims.base * scale : 1;

  const onPointerDown = (e) => {
    if(!dims) return;
    e.currentTarget.setPointerCapture?.(e.pointerId);
    drag.current = { sx:e.clientX, sy:e.clientY, ox:offset.x, oy:offset.y };
  };
  const onPointerMove = (e) => {
    if(!drag.current) return;
    setOffset(clamp({ x:drag.current.ox + (e.clientX-drag.current.sx), y:drag.current.oy + (e.clientY-drag.current.sy) }, displayScale));
  };
  const onPointerUp = () => { drag.current = null; };

  const onZoom = (z) => {
    if(!dims) return;
    const prev = dims.base * scale, nextS = dims.base * z;
    // keep the frame center anchored on the same source point while zooming
    const cx = (FRAME/2 - offset.x) / prev, cy = (FRAME/2 - offset.y) / prev;
    setScale(z);
    setOffset(clamp({ x:FRAME/2 - cx*nextS, y:FRAME/2 - cy*nextS }, nextS));
  };

  const save = () => {
    const el = imgRef.current;
    if(!el || !dims){ onSave(src); return; }   // fallback: save uncropped
    const C = 512;
    const dScale = dims.base * scale;
    const srcW = FRAME / dScale, srcH = FRAME / dScale;
    const srcX = -offset.x / dScale, srcY = -offset.y / dScale;
    const cv = document.createElement('canvas'); cv.width = C; cv.height = C;
    const ctx = cv.getContext('2d');
    try {
      ctx.drawImage(el, srcX, srcY, srcW, srcH, 0, 0, C, C);
      onSave(cv.toDataURL('image/jpeg', 0.82));
    } catch(err) {
      onSave(src); // never get stuck — fall back to the raw photo
    }
  };

  return (
    <div onClick={close} style={{
      position:'absolute', inset:0, zIndex:50,
      background: animIn ? 'rgba(27,20,16,.5)' : 'rgba(27,20,16,0)',
      transition:'background .22s ease', display:'flex', alignItems:'flex-end',
    }}>
      <div onClick={e=>e.stopPropagation()} style={{
        width:'100%', background:'var(--bg)',
        borderTopLeftRadius:28, borderTopRightRadius:28, display:'flex', flexDirection:'column',
        transform: animIn ? 'translateY(0)' : 'translateY(100%)',
        transition:'transform .28s cubic-bezier(.22,.9,.34,1)', overflow:'hidden',
      }}>
        <div style={{ display:'flex', justifyContent:'center', paddingTop:10 }}>
          <div style={{ width:40, height:5, borderRadius:3, background:'var(--line)' }}/>
        </div>
        <div style={{ padding:'14px 22px 28px', textAlign:'center' }}>
          <div style={{ fontSize:18, fontWeight:800, letterSpacing:-.3 }}>position your photo</div>
          <div style={{ fontSize:12.5, color:'var(--ink-2)', marginTop:5 }}>drag to move · slide to zoom</div>

          {/* editing stage */}
          <div
            onPointerDown={onPointerDown} onPointerMove={onPointerMove}
            onPointerUp={onPointerUp} onPointerCancel={onPointerUp}
            style={{
              width:FRAME, height:FRAME, margin:'18px auto 0', position:'relative',
              borderRadius:18, overflow:'hidden', background:'#e9e2d4', touchAction:'none',
              cursor: drag.current ? 'grabbing' : 'grab',
            }}>
            <img ref={imgRef} src={src} draggable={false} onLoad={onImgLoad} style={{
              position:'absolute',
              left: dims ? offset.x : 0, top: dims ? offset.y : 0,
              width: dims ? dims.w * displayScale : FRAME,
              height: dims ? dims.h * displayScale : FRAME,
              objectFit:'cover',
              opacity: dims ? 1 : 0,
              userSelect:'none', pointerEvents:'none',
            }}/>
            {/* dim everything outside the circle */}
            <div style={{
              position:'absolute', inset:0, pointerEvents:'none',
              background:'radial-gradient(circle at center, transparent 0, transparent calc(50% - 1px), rgba(251,244,230,.78) calc(50%), rgba(251,244,230,.82) 100%)',
            }}/>
            <div style={{
              position:'absolute', left:'50%', top:'50%', width:FRAME, height:FRAME,
              transform:'translate(-50%,-50%)', borderRadius:'50%', pointerEvents:'none',
              boxShadow:'inset 0 0 0 2px rgba(255,255,255,.9)',
            }}/>
          </div>

          {/* zoom slider */}
          <div style={{ display:'flex', alignItems:'center', gap:12, margin:'20px 6px 0' }}>
            <Icon.Search size={15} color="var(--ink-2)"/>
            <input type="range" min="1" max="3" step="0.01" value={scale}
              onChange={e=>onZoom(parseFloat(e.target.value))}
              style={{ flex:1, accentColor:'var(--pink)' }}/>
            <Icon.Search size={20} color="var(--ink-2)"/>
          </div>

          <div style={{ marginTop:22, display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
            <button onClick={close} style={{
              padding:'14px', borderRadius:16, fontWeight:700, fontSize:14.5,
              color:'var(--ink-2)', background:'var(--card)',
            }}>cancel</button>
            <button onClick={save} className="btn-primary" style={{
              padding:'14px', borderRadius:16, fontWeight:800, fontSize:14.5,
              background:'var(--pink)', color:'#fff',
            }}>save photo</button>
          </div>
        </div>
      </div>
    </div>
  );
};

const Profile = ({ onEditAccount, onCreate, onSeeGarden, ratings={}, joined=[] }) => {
  const { profile, setProfile } = useProfile();
  const name = profile?.name || 'you';
  const initial = (name[0] || 'Y').toUpperCase();
  const handle = '@' + (profile?.username || name.toLowerCase().replace(/\s+/g,''));
  // Garden = your challenges, shown as growing plants:
  //   • sapling — just started (less than halfway through)
  //   • budding — past the halfway mark, not finished
  //   • bloomed — finished (you rated it on completion) → a grown flower
  const resolveCh = (id) => SEED_CHALLENGES.find(x => x.id === id) || publicChallengeById(id) || friendsChallengeById(id);
  const bloomItems = Object.keys(ratings).map(id => {
    const ch = resolveCh(id);
    if(!ch) return null;
    return { c: ch.cat, t: ch.title, d: ch.days ? ch.days + 'd' : '', stage: 'bloom' };
  }).filter(Boolean);
  const bloomedIds = new Set(Object.keys(ratings));
  const activeItems = SEED_CHALLENGES.filter(c =>
    (c.members?.includes('me') || joined.includes(c.id)) && !bloomedIds.has(c.id) && !(c.dayIn >= c.days)
  ).map(c => {
    const prog = c.days ? (c.dayIn || 0) / c.days : 0;
    return { c: c.cat, t: c.title, d: `${c.dayIn || 0}/${c.days}d`, stage: prog >= 0.5 ? 'bud' : 'sapling' };
  });
  // Bloomed first, then in-progress plants (buds before saplings).
  const stageOrder = { bloom:0, bud:1, sapling:2 };
  const gardenItems = [...bloomItems, ...activeItems].sort((a,b)=>stageOrder[a.stage]-stageOrder[b.stage]);
  const completed = bloomItems.length;   // "flowers grown" = bloomed only
  const activeCount = activeItems.length;

  const myChallenges = SEED_CHALLENGES.filter(c => c.members?.includes('me') || joined.includes(c.id));
  const bestStreak = Math.max(0, ...myChallenges.map(c => c.streak || 0));

  const openGarden = () => onSeeGarden && onSeeGarden(gardenItems, completed);

          <div style={{

            width:32, height:32, borderRadius:16,

            display:'flex', alignItems:'center', justifyContent:'center',
            boxShadow:'0 4px 10px -3px rgba(var(--pink-rgb),.6)',

        </button>
        <div style={{ fontWeight:800, fontSize:24, marginTop:10, letterSpacing:-.3 }}>{name}</div>

        {profile?.bio && (

      {/* Stats triplet */}
      <div style={{

          gardenItems.length>0 && <button onClick={openGarden} style={{ fontSize:12, color:'var(--pink)', fontWeight:700 }}>see all</button>

      </div>
      {gardenItems.length===0 ? (

          margin:'12px 22px',
          background:'linear-gradient(180deg, var(--pink-4) 0%, var(--pink-3) 100%)',
          borderRadius:22, padding:'30px 18px', textAlign:'center',
        }}>
          <div style={{
            width:64, height:64, borderRadius:32, margin:'0 auto',
            background:'var(--card)',

            <Icon.Bloom size={32} color="var(--pink-2)" stroke={1.8}/>
          </div>
          <div style={{ fontWeight:700, fontSize:15, marginTop:12 }}>your garden is empty</div>
          <div style={{ fontSize:12.5, color:'var(--ink-2)', marginTop:3, maxWidth:230, marginLeft:'auto', marginRight:'auto' }}>
            join a challenge to plant a sapling — water it daily and watch it bloom into a flower.
          </div>
        </div>
      ) : (
        <>
          <button onClick={openGarden} style={{
            display:'block', width:'auto', textAlign:'left',
            margin:'12px 22px', background:'linear-gradient(180deg, var(--pink-4) 0%, var(--pink-3) 100%)',
            borderRadius:22, padding:'18px 14px',
          }}>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:14 }}>
              {gardenItems.slice(0,6).map((b,i)=> <GardenBloom key={i} {...b}/>)}

            {gardenItems.length > 6 && (

                marginTop:14, textAlign:'center',
                fontSize:12.5, fontWeight:700, color:'var(--pink)',

          </button>
        </>
      )}

      {/* Categories streak chart — only once you've built history */}
      {/* Where you bloom — real per-category breakdown of your garden */}

        gardenItems.forEach(g => {
          const b = byCat[g.c] || (byCat[g.c] = { total:0, bloomed:0 });

          if(g.stage === 'bloom') b.bloomed += 1;
        });
        const rows = Object.entries(byCat)
          .map(([c, v]) => ({ c, ...v }))
          .sort((a, b) => (b.bloomed - a.bloomed) || (b.total - a.total));
        const maxTotal = Math.max(...rows.map(r => r.total));
        return (
          <>

              <SectionHead title="where you bloom" sub="flowers grown by category"/>

            <div style={{ padding:'12px 22px 0', display:'grid', gap:12 }}>
              {rows.map(r => {
                const cat = catById(r.c);
                const barW = (r.total / maxTotal) * 100;       // bar length = volume vs your biggest category
                const fillW = r.total ? (r.bloomed / r.total) * 100 : 0; // solid part = bloomed share
                return (
                  <div key={r.c} style={{ display:'flex', alignItems:'center', gap:12 }}>
                    <CategoryBadge catId={r.c} size={32}/>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline' }}>

                          {r.bloomed > 0 && <span style={{ color:cat.color }}>{r.bloomed} {r.bloomed===1?'flower':'flowers'}</span>}
                          {r.bloomed > 0 && r.total > r.bloomed && ' · '}
                          {r.total > r.bloomed && <span>{r.total - r.bloomed} growing</span>}
                        </div>
                      </div>
                      <div style={{
                        height:8, background:'var(--pink-4)', borderRadius:4, marginTop:5, overflow:'hidden',
                        width:`${barW}%`, minWidth:24, transition:'width .3s',
                      }}>
                        <div style={{
                          width:`${fillW}%`, height:'100%',
                          background:cat.color, borderRadius:4,
                        }}/>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </>
        );
      })()}

      {/* Fresh-account nudge to start */}
      {gardenItems.length === 0 && (
        <div style={{ padding:'8px 22px 0' }}>
          <button onClick={onCreate} style={{
            width:'100%', textAlign:'left',
            background:'var(--card)', borderRadius:18, padding:'16px',
            display:'flex', alignItems:'center', gap:12,
            boxShadow:'inset 0 1px 0 rgba(255,255,255,.5), 0 8px 18px -12px rgba(120,80,60,.2)',
          }}>
            <div style={{
              width:42, height:42, borderRadius:14, background:'var(--pink-3)', color:'var(--pink)',
              display:'flex', alignItems:'center', justifyContent:'center', flex:'none',
            }}><Icon.Spark size={20} stroke={2.2}/></div>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ fontWeight:700, fontSize:14 }}>start your first challenge</div>
              <div style={{ fontSize:12, color:'var(--ink-2)', marginTop:1 }}>browse discover or create your own</div>
            </div>
            <Icon.Forward size={16} color="var(--muted)"/>
          </button>
        </div>
      )}

    </div>
  );
};

// Emoji cheers — friends react to a challenge to cheer each other on. Cheers are
// stored in the shared 'bloom:cheers' registry keyed by challenge id, so a cheer
// left by one account shows up for everyone else viewing the same challenge.
const CheersSection = ({ challengeId, isMine }) => {
  const { profile } = useProfile();
  const myKey = String(profile?.email || profile?.phone || 'me').toLowerCase();
  const myName = (profile?.name || 'you').split(' ')[0];
  const [cheers, setCheers] = useState(() => cheersFor(challengeId));
  const [pop, setPop] = useState(null);

  const toggle = (emoji) => {
    const mine = cheers.some(c => c.fromKey === myKey && c.emoji === emoji);
    const next = mine
      ? removeCheer(challengeId, myKey, emoji)
      : addCheer(challengeId, { emoji, fromKey: myKey, fromName: myName, ts: Date.now() });
    setCheers([...next]);
    if(!mine){ setPop(emoji); setTimeout(()=>setPop(null), 320); }
  };

  const counts = {};
  cheers.forEach(c => { counts[c.emoji] = (counts[c.emoji] || 0) + 1; });
  const total = cheers.length;

  // unique cheerer names, most recent first ("you" for self)
  const names = [];
  for(let i = cheers.length - 1; i >= 0; i--){
    const nm = cheers[i].fromKey === myKey ? 'you' : cheers[i].fromName;
    if(!names.includes(nm)) names.push(nm);
  }
  const shown = names.slice(0, 2);
  const extra = names.length - shown.length;
  const who = shown.join(', ') + (extra > 0 ? ` +${extra}` : '');
  const onlyMe = names.length === 1 && names[0] === 'you';

  return (
    <>
      <div style={{ padding:'20px 22px 0' }}>
        <SectionHead title="cheers" sub={isMine ? 'love from your circle' : 'cheer them on'}/>
      </div>
      <div style={{
        margin:'10px 22px 0', background:'var(--card)', border:'1px solid var(--line)',
        borderRadius:22, padding:'14px',
      }}>
        <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
          {CHEER_EMOJIS.map(em => {
            const mine = cheers.some(c => c.fromKey === myKey && c.emoji === em);
            const n = counts[em] || 0;
            return (
              <button key={em} onClick={()=>toggle(em)} style={{
                display:'flex', alignItems:'center', gap:5,
                padding: n > 0 ? '7px 12px 7px 10px' : '7px 11px',
                borderRadius:999,
                background: mine ? 'var(--pink)' : 'var(--pink-4)',
                border:`1.5px solid ${mine ? 'var(--pink)' : 'transparent'}`,
                transform: pop === em ? 'scale(1.18)' : 'scale(1)',
                transition:'transform .2s cubic-bezier(.22,.9,.34,1), background .15s',
              }}>
                <span style={{ fontSize:18, lineHeight:1 }}>{em}</span>
                {n > 0 && <span style={{ fontSize:13, fontWeight:800, color: mine ? '#fff' : 'var(--ink-2)' }}>{n}</span>}
              </button>
            );
          })}
        </div>
        <div style={{ marginTop:12, fontSize:12.5, color:'var(--ink-2)', display:'flex', alignItems:'center', gap:7, lineHeight:1.4 }}>
          <Icon.Heart size={14} color="var(--pink)"/>
          {total > 0
            ? <span><b style={{ color:'var(--ink)' }}>{who}</b> cheered {onlyMe ? '' : (isMine ? 'you on ' : 'this challenge ')}· {total} {total === 1 ? 'cheer' : 'cheers'}</span>
            : <span>{isMine ? 'no cheers yet — your circle will show up here' : 'be the first to send a cheer'}</span>}
        </div>
      </div>
    </>
  );
};

      {/* Cheers — friends react with emojis to cheer each other on */}

        </div>
      )}

      {shareOpen && (
        <InviteSheet
          link={shareLink}
          title={canInviteToThis ? 'invite to this challenge' : 'invite friends to Soft Sapling'}

// ===== create-flow.jsx =====
// Create challenge flow — modal with 5 steps:
// 1) category  2) name/rule  3) duration  4) privacy/friends  5) review
const CreateFlow = ({ onClose, onCreated }) => {
  const [step, setStep] = useState(0);
  const [draft, setDraft] = useState({
    cat: null,
    title: '',
    rule: '',
    days: 21,
    privacy: 'friends', // solo / friends / public
    invites: [],
    startToday: true,
  });
  const set = (k,v) => setDraft(d => ({ ...d, [k]:v }));
  const next = () => setStep(s=>Math.min(s+1, 4));
  const back = () => step===0 ? onClose() : setStep(s=>s-1);

  const canNext =
    step===0 ? !!draft.cat :
    step===1 ? draft.title.trim().length >= 3 :
    step===2 ? draft.days > 0 :
    step===3 ? true :
    true;

  const cat = draft.cat ? catById(draft.cat) : null;

  return (
    <div style={{
      position:'absolute', inset:0, background:'var(--bg)', zIndex:30,
      display:'flex', flexDirection:'column',
    }}>
      {/* Header */}
      <div style={{
        padding:'12px 22px 8px',
        display:'flex', justifyContent:'space-between', alignItems:'center',
      }}>
        <button onClick={back} style={{
          width:36, height:36, borderRadius:18, background:'var(--card)',
          display:'flex', alignItems:'center', justifyContent:'center',
          border:'1px solid var(--line)',
        }}>
          {step===0 ? <Icon.X size={18}/> : <Icon.Back size={18}/>}
        </button>
        <div style={{ fontWeight:700, fontSize:13.5 }}>new challenge</div>
        <div style={{ width:36 }}></div>
      </div>

      {/* Step pips */}
      <div style={{ padding:'4px 22px 6px', display:'flex', gap:5 }}>
        {[0,1,2,3,4].map(i=>(
          <div key={i} style={{
            flex:1, height:4, borderRadius:2,
            background: i<=step ? 'var(--pink)' : 'var(--pink-4)',
            transition:'background .2s',
          }}/>
        ))}
      </div>

      {/* Body */}
      <div className="scroll" style={{ flex:1, overflowY:'auto', padding:'10px 22px 100px' }}>
        {step===0 && <StepCategory draft={draft} set={set}/>}
        {step===1 && <StepDetails draft={draft} set={set}/>}
        {step===2 && <StepDuration draft={draft} set={set}/>}
        {step===3 && <StepPrivacy draft={draft} set={set}/>}
        {step===4 && <StepReview draft={draft}/>}
      </div>

      {/* Footer CTA */}
      <div style={{
        position:'absolute', left:0, right:0, bottom:0,
        padding:'12px 22px 32px',
        background:'linear-gradient(180deg, transparent 0%, var(--bg) 30%)',
      }}>
        <button onClick={step===4 ? ()=>onCreated(draft) : next} disabled={!canNext} style={{
          width:'100%', padding:'16px', borderRadius:18,
          background: canNext ? 'var(--pink)' : 'var(--pink-3)',
          color:'#fff', fontWeight:800, fontSize:15,
          display:'flex', alignItems:'center', justifyContent:'center', gap:8,
          boxShadow: canNext ? '0 8px 22px -8px rgba(107,163,131,.55)' : 'none',
          transition:'all .15s',
        }}>
          {step===4 ? 'plant it' : (step===3 ? 'review' : 'next')}
          {step<4 && <Icon.Forward size={16} stroke={2.5}/>}
        </button>
      </div>
    </div>
  );
};

    if(d.length > 3) return `(${a}) ${b}`;
    if(d.length > 0) return `(${a}`;
    return '';
  };
  const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());

  const save = () => {
    if(!valid || saving) return;

// Simple account login: enter an email + phone number and you're in. The phone
// number stays connected to (saved on) the email account. No verification codes.

// Email + phone login that gates the whole app.
const PhoneAuth = ({ onAuthed }) => {
  const [email, setEmail] = useState('');
  const [digits, setDigits] = useState('');     // raw phone digits (up to 10)
  const [submitting, setSubmitting] = useState(false);
  const emailRef = useRef(null);

  useEffect(() => {
    const t = setTimeout(() => emailRef.current?.focus(), 350);
    return () => clearTimeout(t);
  }, []);

  const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
  const phoneValid = digits.length === 10;
  const detailsValid = emailValid && phoneValid;

  const fmt = (d) => {
    const a = d.slice(0,3), b = d.slice(3,6), c = d.slice(6,10);
    if(d.length > 6) return `(${a}) ${b}-${c}`;
    if(d.length > 3) return `(${a}) ${b}`;
    if(d.length > 0) return `(${a}`;
    return '';
  };
  const onPhoneChange = (e) => {
    const d = e.target.value.replace(/\D/g,'').slice(0,10);
    setDigits(d);
  };

  const submit = () => {
    if(!detailsValid || submitting) return;
    setSubmitting(true);
    onAuthed({ email: email.trim().toLowerCase(), phone: '+1 ' + fmt(digits) });
  };

  return (
    <div style={{ position:'absolute', inset:0, background:'var(--bg)', zIndex:50, display:'flex', flexDirection:'column' }}>
      <div className="scroll" style={{ flex:1, overflowY:'auto', padding:'8px 26px 120px', display:'flex', flexDirection:'column', justifyContent:'center' }}>
        {/* brand mark */}
        <div style={{ display:'flex', justifyContent:'center' }}>
          <div style={{
            width:88, height:88, borderRadius:44,
            background:'linear-gradient(135deg, var(--pink) 0%, var(--pink-2) 100%)',
            display:'flex', alignItems:'center', justifyContent:'center',
            boxShadow:'0 18px 38px -14px rgba(var(--pink-rgb),.6)',
          }}>
            <Icon.Bloom size={46} color="#fff" stroke={2}/>
          </div>
        </div>

        <h1 style={{ fontSize:30, fontWeight:800, letterSpacing:-.6, textAlign:'center', margin:'22px 0 6px' }}>welcome to Soft Sapling</h1>
        <p style={{ fontSize:14.5, color:'var(--ink-2)', textAlign:'center', margin:'0 auto', maxWidth:280, lineHeight:1.45 }}>
          enter your email and phone to log in or create your account.
        </p>

        <div style={{ marginTop:28 }}>
          <div style={{ fontSize:12, fontWeight:700, color:'var(--ink-2)', marginBottom:8, letterSpacing:.3 }}>EMAIL</div>
          <div style={{
            background:'var(--card)', borderRadius:16, padding:'4px 6px',
            display:'flex', alignItems:'center', gap:8,
            boxShadow:'inset 0 1px 0 rgba(255,255,255,.55), 0 8px 20px -12px rgba(120,80,60,.22)',
          }}>
            <div style={{ padding:'0 6px 0 10px', display:'flex', alignItems:'center' }}>
              <Icon.Mail size={18} color="var(--muted)" stroke={2}/>
            </div>
            <input
              ref={emailRef}
              value={email}
              onChange={e=>setEmail(e.target.value)}
              type="email"
              inputMode="email"
              autoCapitalize="none"
              autoCorrect="off"
              placeholder="you@email.com"
              onKeyDown={e=>{ if(e.key==='Enter' && detailsValid) submit(); }}
              style={{ flex:1, border:'none', outline:'none', background:'transparent', fontSize:16.5, fontWeight:600, padding:'13px 8px 13px 0' }}
            />
          </div>
        </div>

        <div style={{ marginTop:18 }}>
          <div style={{ fontSize:12, fontWeight:700, color:'var(--ink-2)', marginBottom:8, letterSpacing:.3 }}>PHONE NUMBER</div>
          <div style={{
            background:'var(--card)', borderRadius:16, padding:'4px 6px',
            display:'flex', alignItems:'center', gap:8,
            boxShadow:'inset 0 1px 0 rgba(255,255,255,.55), 0 8px 20px -12px rgba(120,80,60,.22)',
          }}>
            <div style={{
              display:'flex', alignItems:'center', gap:6,
              padding:'12px 12px', borderRight:'1px solid var(--line)',
              fontSize:16, fontWeight:700,
            }}>
              <span style={{ fontSize:18 }}>🇺🇸</span> +1
            </div>
            <input
              value={fmt(digits)}
              onChange={onPhoneChange}
              inputMode="numeric"
              placeholder="(555) 123-4567"
              onKeyDown={e=>{ if(e.key==='Enter' && detailsValid) submit(); }}
              style={{ flex:1, border:'none', outline:'none', background:'transparent', fontSize:17, fontWeight:600, padding:'12px 4px' }}
            />
          </div>
          <div style={{ fontSize:11.5, color:'var(--muted)', marginTop:10, display:'flex', alignItems:'center', gap:6 }}>

      </div>

      {/* CTA */}
      <div style={{
        position:'absolute', left:0, right:0, bottom:0,
        padding:'12px 26px 34px',
        background:'linear-gradient(180deg, transparent 0%, var(--bg) 30%)',
      }}>
        <button onClick={submit} disabled={!detailsValid || submitting} className={detailsValid && !submitting ? 'btn-primary':''} style={{
          width:'100%', padding:'16px', borderRadius:18,
          background: detailsValid ? 'var(--pink)' : 'var(--pink-3)',
          color:'#fff', fontWeight:800, fontSize:15,
          display:'flex', alignItems:'center', justifyContent:'center', gap:8,
          transition:'all .15s', opacity: submitting ? .8 : 1,
        }}>continue <Icon.Forward size={16} stroke={2.5}/></button>
        <div style={{ textAlign:'center', marginTop:12, fontSize:11, color:'var(--muted)', lineHeight:1.4 }}>
