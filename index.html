// ===== onboarding.jsx =====
// First-launch flow: welcome → name → photo → interests → ready.
const Onboarding = ({ initial, onDone, onCancel }) => {
  const [step, setStep] = useState(initial ? 1 : 0);
  const [username, setUsername] = useState(initial?.username || '');
  const [name, setName] = useState(initial?.name || '');
  const [photo, setPhoto] = useState(initial?.photo || null);
  const [bio, setBio] = useState(initial?.bio || '');
  const [interests, setInterests] = useState(initial?.interests || []);
  const [adjustSrc, setAdjustSrc] = useState(null); // photo being positioned in the circle
  const fileRef = useRef(null);

  const TOTAL = 7; // 0..6
  const next = () => setStep(s => Math.min(s+1, TOTAL-1));
  const back = () => {
    if(step === 0){ onCancel && onCancel(); return; }
    if(initial && step === 1){ onCancel && onCancel(); return; }
    setStep(s => Math.max(s-1, 0));
  };
  const usernameAvailable = isUsernameAvailable(username, initial?.email);

  // Picking a photo opens the position/zoom sheet so you can frame it in the circle.
  const onPhotoPick = (file) => {
    if(!file) return;
    fileToCompressedDataURL(file, 1080, 0.82).then(setAdjustSrc).catch(()=>{});
  };

  const toggleInterest = (id) => {
    setInterests(arr => arr.includes(id) ? arr.filter(x=>x!==id) : [...arr, id]);
  };

  const complete = () => onDone({ username: normUsername(username), name: name.trim(), photo, bio: bio.trim(), interests });

  const canNext =
    step === 0 ? true :
    step === 1 ? normUsername(username).length >= 3 && usernameAvailable :
    step === 2 ? name.trim().length >= 2 :
    step === 3 ? !!photo :
    step === 4 ? true :
    step === 5 ? true :
    true;

  return (
    <div style={{ position:'absolute', inset:0, background:'var(--bg)', zIndex:50, display:'flex', flexDirection:'column' }}>
      {/* Header */}
      <div style={{
        padding:'14px 22px 6px',
        display:'flex', justifyContent:'space-between', alignItems:'center', height:52,
      }}>
        {step > 0 ? (
          <button onClick={back} style={{
            width:36, height:36, borderRadius:18, background:'var(--card)',
            display:'flex', alignItems:'center', justifyContent:'center',
            border:'1px solid var(--line)',
          }}>
            {initial && step===1 ? <Icon.X size={18}/> : <Icon.Back size={18}/>}
          </button>
        ) : <div style={{width:36}}/>}
        <div style={{ fontWeight:700, fontSize:13.5, color:'var(--ink-2)' }}>
          {initial ? 'edit profile' : (step === 0 ? '' : `step ${step} of 6`)}
        </div>
        <div style={{ width:36 }}/>
      </div>

      {/* Step pips (hidden on welcome) */}
      {step > 0 && (
        <div style={{ padding:'4px 22px 8px', display:'flex', gap:5 }}>
          {[1,2,3,4,5,6].map(i => (
            <div key={i} style={{
              flex:1, height:4, borderRadius:2,
              background: i <= step ? 'var(--pink)' : 'var(--pink-4)',
              transition:'background .2s',
            }}/>
          ))}
        </div>
      )}

      <div className="scroll" style={{ flex:1, overflowY:'auto', padding:'8px 22px 110px' }}>
        {step === 0 && <StepWelcome onStart={next}/>}
        {step === 1 && <StepUsername username={username} setUsername={setUsername} available={usernameAvailable}/>}
        {step === 2 && <StepName name={name} setName={setName}/>}
        {step === 3 && <StepPhoto photo={photo} setPhoto={setPhoto} fileRef={fileRef} onPick={onPhotoPick} name={name}/>}
        {step === 4 && <StepBio bio={bio} setBio={setBio}/>}
        {step === 5 && <StepInterests interests={interests} toggle={toggleInterest}/>}
        {step === 6 && <StepReady name={name} photo={photo} interests={interests}/>}
      </div>

      {/* Footer CTA */}
      {step !== 0 && (
        <div style={{
          position:'absolute', left:0, right:0, bottom:0,
          padding:'12px 22px 32px',
          background:'linear-gradient(180deg, transparent 0%, var(--bg) 30%)',
        }}>
          {step === 5 && interests.length === 0 && (
            <button onClick={next} style={{
              width:'100%', padding:'12px', textAlign:'center',
              color:'var(--ink-2)', fontSize:13, fontWeight:600,
            }}>skip for now</button>
          )}
          <button
            onClick={step === 6 ? complete : next}
            disabled={!canNext}
            style={{
              width:'100%', padding:'16px', borderRadius:18,
              background: canNext ? 'var(--pink)' : 'var(--pink-3)',
              color:'#fff', fontWeight:800, fontSize:15,
              display:'flex', alignItems:'center', justifyContent:'center', gap:8,
              boxShadow: canNext ? '0 8px 22px -8px rgba(107,163,131,.6)' : 'none',
              transition:'all .15s',
            }}
          >
            {step === 6 ? (initial ? 'save profile' : 'enter Soft Sapling') : 'continue'}
            {step < 6 && <Icon.Forward size={16} stroke={2.5}/>}
          </button>
        </div>
      )}

      {adjustSrc && (
        <PhotoAdjustSheet
          src={adjustSrc}
          onSave={(p)=>{ setPhoto(p); setAdjustSrc(null); }}
          onClose={()=>setAdjustSrc(null)}
        />
      )}
    </div>
  );
};

const CompletionFlow = ({ challenge, onClose, onSubmit }) => {
  const [phase, setPhase] = useState('celebrate'); // 'celebrate' | 'rate'
  const [stars, setStars] = useState(0);
  const [hoverStar, setHoverStar] = useState(0);
  const [difficulty, setDifficulty] = useState(null); // 'easy' | 'right' | 'hard'
  const [again, setAgain] = useState(null); // true/false
  const [note, setNote] = useState('');
  const [bloom, setBloom] = useState(false);

  useEffect(() => {
    const t = setTimeout(() => setBloom(true), 80);
    return () => clearTimeout(t);
  }, []);

  if(!challenge) return null;
  const cat = catById(challenge.cat);
  const G = Icon[cat.icon];

  const canSubmit = stars > 0 && difficulty && again !== null;

  return (
    <div style={{
      position:'absolute', inset:0, zIndex:60,

        {Array.from({length:14}).map((_,i)=>{

            <div key={i} style={{
              position:'absolute',
              left:`${(i*7+5)%100}%`, top:'-20px',
              width: 8 + (i%3)*3, height: 8 + (i%3)*3,
              borderRadius: i%2 ? '50% 0 50% 50%' : '50%',
              background: palette[i%palette.length],
              opacity:.85,
              animation:`flowerFall ${3 + (i%4)*0.7}s ${i*0.18}s ease-in infinite`,
              transform:'rotate('+(i*40)+'deg)',
            }}/>
          );
        })}
      </div>

      {phase==='celebrate' ? (
        <div style={{
          flex:1, display:'flex', flexDirection:'column',
          alignItems:'center', justifyContent:'center', textAlign:'center',
          padding:'40px 28px', position:'relative', zIndex:1,
        }}>

          <div style={{
            width:150, height:150, borderRadius:'50%',
            background:`conic-gradient(${cat.color} 0 360deg)`,
            padding:6,
            transform: bloom ? 'scale(1)' : 'scale(.3)',

            <div style={{
              width:'100%', height:'100%', borderRadius:'50%',

              boxShadow:'inset 0 2px 6px rgba(255,255,255,.6)',

              <G size={64} color={cat.color} stroke={1.8}/>

          </div>

          <div style={{
            marginTop:28, fontSize:12, fontWeight:800, letterSpacing:2,
            color:cat.color, textTransform:'uppercase',
            transform: bloom ? 'translateY(0)' : 'translateY(12px)',
            opacity: bloom ? 1 : 0, transition:'all .5s .3s',
          }}>challenge complete</div>
          <h1 style={{
            fontSize:32, fontWeight:800, letterSpacing:-.6, margin:'8px 0 0', textWrap:'balance',
            transform: bloom ? 'translateY(0)' : 'translateY(12px)',
            opacity: bloom ? 1 : 0, transition:'all .5s .4s',
          }}>{challenge.title}</h1>
          <p style={{
            fontSize:15, color:'var(--ink-2)', margin:'10px 0 0', maxWidth:280, lineHeight:1.4,
            transform: bloom ? 'translateY(0)' : 'translateY(12px)',
            opacity: bloom ? 1 : 0, transition:'all .5s .5s',
          }}>you showed up for {challenge.days} days straight. that's a bloom worth keeping.</p>

          {/* stat chips */}
          <div style={{
            display:'flex', gap:10, marginTop:24,

              <div style={{ fontSize:14, fontWeight:700, marginBottom:8 }}>how hard was it?</div>

                  const on = again===o.v;

                    <button key={String(o.v)} onClick={()=>setAgain(o.v)} style={{
                      flex:1, padding:'12px 6px', borderRadius:14,
                      background: on ? 'var(--pink)' : 'var(--card)',
                      color: on ? '#fff' : 'var(--ink)',
                      fontWeight:700, fontSize:13,
                      display:'flex', alignItems:'center', justifyContent:'center', gap:6,
                      transition:'all .12s',

          <div style={{

// ── Account persistence — each EMAIL gets its own saved account ─────────────
const acctKey = (email) => 'bloom:acct:' + String(email||'').trim().toLowerCase();
const loadAccount = (email) => {
  try {
    const raw = localStorage.getItem(acctKey(email));
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
};
const saveAccount = (email, data) => {
  try {
    localStorage.setItem(acctKey(email), JSON.stringify(data));
    return true;
  } catch (e) {
    // Most likely the storage quota — surface it so it's debuggable instead of
    // silently losing data. Compressed photos keep accounts small to avoid this.
    console.warn('bloom: could not save account', email, e?.name || e);
    return false;
  }
};
const hydrateModules = (acct) => {
  // Module-level arrays (challenges + contact registry) restored in place.
  SEED_CHALLENGES.length = 0;
  (acct?.challenges || []).forEach(c => SEED_CHALLENGES.push(c));
  CONTACT_REGISTRY.length = 0;
  (acct?.contacts || []).forEach(c => CONTACT_REGISTRY.push(c));
  // keep the id sequence ahead of restored contacts
  _ctSeq = CONTACT_REGISTRY.reduce((m,c)=>Math.max(m, parseInt(String(c.id).replace(/\D/g,''))||0), 0);
};

const App = () => {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  useEffect(() => {
    const p = tweaks.palette || PALETTES.sage;
    const r = document.documentElement.style;
    r.setProperty('--pink',   p[0]);
    r.setProperty('--pink-2', p[1]);
    r.setProperty('--pink-3', p[2]);
    r.setProperty('--pink-4', p[3]);
    const hex = p[0].replace('#','');
    const rgb = [0,2,4].map(i => parseInt(hex.slice(i,i+2), 16)).join(',');
    r.setProperty('--pink-rgb', rgb);
  }, [tweaks.palette]);

  // Boot from a saved session (runs once). Restores the logged-in EMAIL's
  // account — profile, challenges, contacts — so a reload keeps you signed in.
  const [boot] = useState(() => {
    try {
      const email = localStorage.getItem('bloom:session');
      if(!email) return { email:null, acct:null };
      const acct = loadAccount(email);
      if(acct){ hydrateModules(acct); return { email, acct }; }
      return { email, acct:null };
    } catch { return { email:null, acct:null }; }
  });

  const [auth, setAuthState] = useState(boot.email || null);  // current account email
  const [authPhone, setAuthPhone] = useState(boot.acct?.profile?.phone || null); // captured at login
  const [profile, setProfileState] = useState(boot.acct?.profile || null);
  const setProfile = (p) => setProfileState(p);  // persistence handled by save effect

  const [editingProfile, setEditingProfile] = useState(false);
  const [editingAccount, setEditingAccount] = useState(false);
  const [connectInviteOpen, setConnectInviteOpen] = useState(false);
  const [tab, setTab] = useState('discover');
  const [detailId, setDetailId] = useState(null);   // open challenge id
  const [creating, setCreating] = useState(false);  // create modal open
  const [created, setCreated] = useState(null);     // last created challenge (for toast)
  const [joined, setJoined] = useState(boot.acct?.joined || []);         // ids we've joined
  const [checkIns, setCheckIns] = useState(boot.acct?.checkIns || {});   // { [id]: { photo, note, time } }
  const [pendingCheckIn, setPendingCheckIn] = useState(null); // challenge id
  const [completing, setCompleting] = useState(null);  // challenge id finishing → celebration
  const [gardenView, setGardenView] = useState(null);  // {items, completed} → full-screen garden page
  const [ratings, setRatings] = useState(boot.acct?.ratings || {});      // { [id]: {stars,...} }
  const [circle, setCircle] = useState(boot.acct?.circle || []);         // contact ids added as friends
  const [invited, setInvited] = useState(boot.acct?.invited || []);      // contact ids texted an invite
  const [linkInvites, setLinkInvites] = useState(boot.acct?.linkInvites || []); // invite codes redeemed via link
  const [challengesVersion, setChallengesVersion] = useState(0); // bumps when SEED_CHALLENGES mutates
  const addToCircle = (id) => setCircle(s => s.includes(id) ? s : [...s, id]);
  const markInvited = (id) => setInvited(s => s.includes(id) ? s : [...s, id]);

  // Redeem a friend's invite code (from a ?join= link or pasted by the user).
  // Saving the code to this account is what makes the shared challenge visible
  // in "from your friends". Returns the matched challenge id, if any.
  const redeemCode = (raw) => {
    const code = String(raw || '').trim().replace(/^.*[?&]join=/, '').replace(/[?#].*$/, '').trim();
    if(!code) return null;
    setLinkInvites(s => s.includes(code) ? s : [...s, code]);
    const ch = friendsChallengeByCode(code);
    if(ch){ setTab('discover'); setTimeout(()=>setDetailId(ch.id), 60); return ch.id; }
    return null;
  };

  // On load (and whenever we sign in), pick up a ?join=<code> from the URL,
  // redeem it, then strip it so a refresh doesn't re-trigger.
  useEffect(() => {
    if(!auth) return;
    try {
      const params = new URLSearchParams(location.search);
      const code = params.get('join');
      if(code){
        setLinkInvites(s => s.includes(code) ? s : [...s, code]);
        const ch = friendsChallengeByCode(code);
        params.delete('join');
        const qs = params.toString();
        history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''));
        if(ch){ setTab('discover'); setTimeout(()=>setDetailId(ch.id), 80); }
      }
    } catch {}
  }, [auth]);

  // Log in with an email (+ attached phone): restore that email's account, or start fresh.
  const handleAuthed = ({ email, phone }) => {
    setAuthPhone(phone || null);
    const acct = loadAccount(email);
    if(acct){
      hydrateModules(acct);
      setProfileState(acct.profile || null);
      setCheckIns(acct.checkIns || {});
      setRatings(acct.ratings || {});
      setCircle(acct.circle || []);
      setInvited(acct.invited || []);
      setJoined(acct.joined || []);
      setLinkInvites(acct.linkInvites || []);
    } else {
      // brand-new email — empty account
      hydrateModules(null);
      setProfileState(null);
      setCheckIns({}); setRatings({}); setCircle([]); setInvited([]); setJoined([]); setLinkInvites([]);
    }
    setChallengesVersion(v => v + 1);
    try { localStorage.setItem('bloom:session', email); } catch {}
    setAuthState(email);
  };

  // Log out: clear the session and return to the login page. The account itself
  // stays saved under its email, so logging back in restores everything.
  const handleLogout = () => {
    try { localStorage.removeItem('bloom:session'); } catch {}
    hydrateModules(null);
    setProfileState(null);
    setCheckIns({}); setRatings({}); setCircle([]); setInvited([]); setJoined([]);
    setLinkInvites([]);
    setAuthPhone(null);
    setTab('discover');
    setDetailId(null); setCreating(false); setEditingProfile(false);
    setChallengesVersion(v => v + 1);
    setAuthState(null);
  };

  // Start over: wipe ALL Soft Sapling data (this account, every account, and the
  // shared public/friends/cheers registries) and return to a fresh login — like a
  // brand-new install. Runs from the user's own tap, so nothing is recoverable.
  const handleReset = () => {
    try {
      Object.keys(localStorage)
        .filter(k => k.startsWith('bloom:'))
        .forEach(k => localStorage.removeItem(k));
    } catch {}
    hydrateModules(null);
    setProfileState(null);
    setCheckIns({}); setRatings({}); setCircle([]); setInvited([]); setJoined([]);
    setLinkInvites([]);
    setAuthPhone(null);
    setTab('discover');
    setDetailId(null); setCreating(false); setEditingProfile(false); setEditingAccount(false);
    setChallengesVersion(v => v + 1);
    setAuthState(null);
  };
  // account to the new email key (it's the account identity) and update the session.
  const handleSaveAccount = ({ username, email, phone, bio }) => {
    const oldEmail = auth;
    const newProfile = { ...profile, username, email, phone, bio };
    if(email && email !== oldEmail){
      try {
        saveAccount(email, {
          profile: newProfile,
          challenges: SEED_CHALLENGES,
          contacts: CONTACT_REGISTRY,
          joined, checkIns, ratings, circle, invited, linkInvites,
        });
        if(oldEmail) localStorage.removeItem(acctKey(oldEmail));
        localStorage.setItem('bloom:session', email);
      } catch {}
      setAuthState(email);
    }
    if(username) registerUsername(username, email || oldEmail, newProfile.name, newProfile.photo);
    setAuthPhone(phone);
    setProfileState(newProfile);
    setEditingAccount(false);
  };

  // Persist the whole account whenever anything meaningful changes. Email + phone
  // are always written (both on the profile and at the top level) so the account
  // stays connected to the number it was created with.
  useEffect(() => {
    if(!auth || !profile) return;
    const fullProfile = {
      ...profile,
      email: profile.email || auth,
      phone: profile.phone || authPhone || null,
    };
    saveAccount(auth, {
      email: auth,
      phone: fullProfile.phone,
      profile: fullProfile,
      challenges: SEED_CHALLENGES,
      contacts: CONTACT_REGISTRY,
      joined, checkIns, ratings, circle, invited, linkInvites,
    });
  }, [auth, profile, authPhone, joined, checkIns, ratings, circle, invited, linkInvites, challengesVersion]);


  // Resolve any challenge by id (your own, a shared public one, or a friends one)
  const findChallenge = (id) => {
    const c = SEED_CHALLENGES.find(x => x.id === id);
    if(c) return c;
    const p = publicChallengeById(id) || friendsChallengeById(id);
    if(p) return {
      id:p.id, cat:p.cat, title:p.title, tagline:p.tagline || 'community challenge',
      days:p.days, dayIn:0, members:[], host:'community', hostName:p.hostName,
      rule:p.rule || catById(p.cat).prompt, streak:0, totalDone:0, ofMembers:p.members||1,
    };
    return null;
  };

  const openChallenge = (id, source) => {
    if(id) setDetailId(id);
    else if(source==='mine') setTab('mine');
  };
  const closeDetail = () => setDetailId(null);

  // Join a challenge. For a shared public OR friends challenge, add a personal
  // copy to your own challenges (so it shows in Mine / Today) and bump its count.
  const handleJoin = (id) => {
    setJoined(j => j.includes(id) ? j : [...j, id]);
    if(SEED_CHALLENGES.some(c => c.id === id)) return; // already yours
    const isFriends = !publicChallengeById(id) && !!friendsChallengeById(id);
    const p = publicChallengeById(id) || friendsChallengeById(id);
    if(p){
      SEED_CHALLENGES.unshift({
        id:p.id, code:p.code, cat:p.cat, title:p.title,
        tagline:p.tagline || 'community challenge',
        days:p.days, dayIn:0, members:['me'], host:'community', emoji:'🌱',
        rule:p.rule || catById(p.cat).prompt,
        streak:0, totalDone:0, ofMembers:(p.members||1)+1,
        privacy: isFriends ? 'friends' : 'public', startsLater:false, invitesCount:0,
      });
      if(isFriends) bumpFriendsMembers(id); else bumpPublicMembers(id);
      setChallengesVersion(v => v + 1);
    }
  };

  const handleCreated = (draft) => {
    const id = 'u' + Date.now();
    const startsLater = draft.startToday === false;
    const ch = {
      id, cat: draft.cat, title: draft.title,
      tagline: draft.rule ? draft.rule : 'your challenge',
      days: draft.days, dayIn: 0,
      members: ['me'], host: 'me', emoji: '🌱',
      rule: draft.rule || catById(draft.cat).prompt,
      streak: 0, totalDone: 0, ofMembers: 1,
      privacy: draft.privacy, startsLater,
      invitesCount: (draft.invites || []).length,
    };
    SEED_CHALLENGES.unshift(ch);
    // Public challenges go into the shared registry so EVERY account sees them
    // in Discover — independent of who's logged in.
    if(draft.privacy === 'public'){
      addPublicChallenge({
        id, cat: draft.cat, title: draft.title,
        tagline: ch.tagline, rule: ch.rule, days: draft.days,
        hostName: (profile?.name || 'someone').split(' ')[0],
        hostEmail: auth || null,
        members: 1, createdAt: Date.now(),
      });
    }
    // Friends-only challenges go into the friends registry with a short invite
    // code. Anyone who opens the invite link (?join=<code>) redeems the code and
    // can then see + join the challenge — no contacts needed.
    if(draft.privacy === 'friends'){
      const code = draft.code || genInviteCode();
      ch.code = code;
      addFriendsChallenge({
        id, code, cat: draft.cat, title: draft.title,
        tagline: ch.tagline, rule: ch.rule, days: draft.days,
        hostName: (profile?.name || 'someone').split(' ')[0],
        hostEmail: auth || null,
        members: 1, createdAt: Date.now(),
      });
    }
    setChallengesVersion(v => v + 1);
    setCreating(false);
    setCreated({ ...draft, id });
    setTab('mine');
    setTimeout(()=>setCreated(null), 3600);
  };

  // current screen
  let screen;
  if(tab==='discover') screen = <Discover
    onOpenChallenge={openChallenge}
    onCreate={()=>setCreating(true)}
    joined={joined} onJoin={handleJoin}
    checkIns={checkIns}
    onRequestCheckIn={(id)=>setPendingCheckIn(id)}
    todayStyle={tweaks.todayStyle}
    linkInvites={linkInvites}
    discoverFrame={tweaks.discoverBackdrop !== 'off'}/>;
  else if(tab==='mine') screen = <Mine onOpen={openChallenge} onCreate={()=>setCreating(true)} joined={joined} ratings={ratings}/>;
  else if(tab==='connect') screen = <Connect onOpen={openChallenge}
    onRedeem={redeemCode} appLink={APP_INVITE_LINK} myEmail={auth} circle={circle}
    onAddFriend={(r)=>{ const c = registerContact({ name:r.name, username:r.username, photo:r.photo }); addToCircle(c.id); }}
    inviteOpen={connectInviteOpen} setInviteOpen={setConnectInviteOpen}/>;
  else if(tab==='profile') screen = <Profile onEditAccount={()=>setEditingAccount(true)} onCreate={()=>setCreating(true)} onSeeGarden={(items,n)=>setGardenView({items,completed:n})} ratings={ratings} joined={joined}/>;

  // Auth gate — email login before anything else
  if(!auth){
    return (
      <>
      <IOSDevice width={402} height={874}>
        <PhoneAuth onAuthed={(creds)=>handleAuthed(creds)}/>
      </IOSDevice>
      <BloomTweaks tweaks={tweaks} setTweak={setTweak}/>
      </>
    );
  }

  // Onboarding gate — authed but no profile yet
  if(!profile){
    return (
      <>
      <IOSDevice width={402} height={874}>
        <ProfileCtx.Provider value={{ profile:null, setProfile }}>
          <Onboarding onDone={(p)=>{ registerUsername(p.username, auth, p.name, p.photo); setProfile({ ...p, email: auth, phone: authPhone }); }}/>
        </ProfileCtx.Provider>
      </IOSDevice>
      <BloomTweaks tweaks={tweaks} setTweak={setTweak}/>
      </>
    );
  }

  return (
    <>
    <IOSDevice width={402} height={874}>
      <ProfileCtx.Provider value={{ profile, setProfile }}>
      <div style={{
        position:'absolute', inset:0, background:'var(--bg)',
        overflow:'hidden',
      }}>
        {/* status bar safe area handled by iOS frame; we leave 50px top for status */}
        <div className="scroll" style={{
          position:'absolute', inset:0, top:50, bottom:0,
          overflowY:'auto',
        }}>
          {screen}
        </div>

        {/* FAB on discover too */}
        {tab==='discover' && !gardenView && <FloatingFab onClick={()=>setCreating(true)}/>}
        {tab==='profile'  && !gardenView && <FloatingFab onClick={()=>setCreating(true)}/>}
        {tab==='connect'  && !gardenView && <FloatingFab onClick={()=>setConnectInviteOpen(true)} label="invite"/>}

        {/* Detail overlay */}
        {detailId && (
          <div style={{
            position:'absolute', inset:0, top:50, bottom:0,
            background:'var(--bg)', zIndex:20, overflowY:'auto',
          }} className="scroll">
            <ChallengeDetail
              id={detailId}
              entry={checkIns[detailId]}
              onRequestCheckIn={(id)=>setPendingCheckIn(id)}
              joined={joined.includes(detailId)}
              onJoin={()=>handleJoin(detailId)}
              onBack={closeDetail}
            />
          </div>
        )}

        {/* Create overlay */}
        {creating && (
          <CreateFlow
            onClose={()=>setCreating(false)}
            onCreated={handleCreated}
          />
        )}

        {/* Check-in sheet */}
        {pendingCheckIn && (
          <CheckInSheet
            challenge={findChallenge(pendingCheckIn)}
            onClose={()=>setPendingCheckIn(null)}
            onConfirm={(entry)=>{
              const ch = findChallenge(pendingCheckIn);
              const isFinalDay = ch && (ch.dayIn + 1 >= ch.days);
              setCheckIns(s => ({ ...s, [pendingCheckIn]: entry }));
              const id = pendingCheckIn;
              setPendingCheckIn(null);
              if(isFinalDay){
                // let the sheet animate out, then celebrate
                setTimeout(()=>setCompleting(id), 280);
              }
            }}
          />
        )}

        {/* Completion celebration + rating */}
        {completing && (
          <CompletionFlow
            challenge={findChallenge(completing)}
            onClose={()=>setCompleting(null)}
            onSubmit={(rating)=>{
              setRatings(r => ({ ...r, [completing]: rating }));
              setCompleting(null);
              setTab('profile');
            }}
          />
        )}

        {/* Created toast */}
        {created && (
          <div style={{
            position:'absolute', left:18, right:18, bottom:104, zIndex:40,
            background:'#1B1410', color:'#fff',
            padding:'14px 16px', borderRadius:18,
            display:'flex', alignItems:'center', gap:12,
            animation:'slideUp .4s ease-out',
            boxShadow:'0 16px 30px -10px rgba(0,0,0,.3)',
          }}>
            <div style={{
              width:34, height:34, borderRadius:17,
              background:'var(--pink)',
              display:'flex', alignItems:'center', justifyContent:'center',
            }}>
              <Icon.Check size={18} color="#fff" stroke={3}/>
            </div>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ fontSize:13.5, fontWeight:700 }}>planted!</div>
              <div style={{ fontSize:11.5, color:'rgba(255,255,255,.7)', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
                {created.title} · {created.days} days
              </div>
            </div>
            <button onClick={()=>setCreated(null)} style={{ color:'rgba(255,255,255,.6)' }}>
              <Icon.X size={16}/>
            </button>
          </div>
        )}

        {/* Tab bar — hidden during create flow */}
        {!creating && !editingProfile && !completing && !gardenView && <TabBar active={tab} onChange={(t)=>{ setDetailId(null); setTab(t); }}/>}

        {/* Edit profile overlay */}
        {editingProfile && (
          <Onboarding
            initial={profile}
            onDone={(p)=>{ registerUsername(p.username, profile?.email || auth, p.name, p.photo); setProfile({ ...profile, ...p }); setEditingProfile(false); }}
            onCancel={()=>setEditingProfile(false)}
          />
        )}

        {/* Edit account (email + phone) overlay */}
        {editingAccount && (
          <AccountEditSheet
            profile={profile}
            onSave={handleSaveAccount}
            onClose={()=>setEditingAccount(false)}
            onLogout={handleLogout}
            onReset={handleReset}
            onEditProfile={()=>{ setEditingAccount(false); setEditingProfile(true); }}
          />
        )}

        {/* Garden — full-screen page (its own page, above everything) */}
        {gardenView && (
          <GardenOverlay
            blooms={gardenView.items}
            completed={gardenView.completed}
            onClose={()=>setGardenView(null)}
          />
        )}
      </div>
      </ProfileCtx.Provider>

      <style>{`
        @keyframes slideUp {
          from { transform: translateY(20px); opacity:0; }
          to   { transform: translateY(0); opacity:1; }
        }
      `}</style>
    </IOSDevice>
    <BloomTweaks tweaks={tweaks} setTweak={setTweak}/>
    </>
  );
};

const BloomTweaks = ({ tweaks, setTweak }) => {
  const currentName = (() => {
    const p = tweaks.palette;
    for(const [name, arr] of Object.entries(PALETTES)){
      if(arr[0] === p?.[0]) return name;
    }
    return 'custom';
  })();
  return (
    <TweaksPanel>
      <TweakSection label="theme"/>
      <TweakColor
        label="palette"
        value={tweaks.palette}
        options={PALETTE_LIST}
        onChange={(v) => setTweak('palette', v)}
      />
      <div style={{
        textAlign:'center', fontSize:11, color:'#888',
        margin:'-4px 0 8px', textTransform:'uppercase', letterSpacing:1,
      }}>{currentName}</div>

      <TweakSection label="today check-in"/>
      <TweakRadio
        label="layout"
        value={tweaks.todayStyle}
        options={['list','stories','focus']}
        onChange={(v) => setTweak('todayStyle', v)}
      />

      <TweakSection label="discover more"/>
      <TweakRadio
        label="backdrop"
        value={tweaks.discoverBackdrop}
        options={['on','off']}
        onChange={(v) => setTweak('discoverBackdrop', v)}
      />
    </TweaksPanel>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);



</script>
</body>
</html>
